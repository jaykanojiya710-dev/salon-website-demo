name: Build Cloudflare static site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate the Prisma client
        run: bunx prisma generate

      - name: Build the static site for Cloudflare
        run: bun run build
        env:
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_SITE_URL: https://salon-website-demo.formastudioisindia.workers.dev/

      - name: Upload the Cloudflare site files
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-static-site
          path: ./out
          if-no-files-found: error
          retention-days: 1
